<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auction Simulator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5">
    <h1 class="text-center mb-4">Auction Simulator</h1>

    <div class="card shadow-sm p-4 mb-4">
        <form method="POST" id="auctionForm">
            <h4>Add Bidders</h4>
            <div id="bidders">
                <div class="row mb-2">
                    <div class="col">
                        <input type="text" name="name" class="form-control" placeholder="Bidder Name" required>
                    </div>
                    <div class="col">
                        <input type="number" name="value" class="form-control" placeholder="Private Value" required>
                    </div>
                </div>
            </div>
            <button type="button" class="btn btn-secondary mb-3" onclick="addBidder()">Add Another Bidder</button>

            <h4>Select Auction Type</h4>
            <select name="auction_type" class="form-select mb-3" required>
                <option value="english">English Auction</option>
                <option value="first_price">First-Price Sealed Bid</option>
                <option value="second_price">Second-Price (Vickrey)</option>
            </select>

            <button type="submit" class="btn btn-primary w-100">Run Auction</button>
        </form>
    </div>

    <div class="card shadow-sm p-4">
        <h4>Results</h4>
        <pre class="bg-light p-3" style="height: 200px; overflow-y: auto;">{{ result }}</pre>
    </div>
</div>

<!-- JavaScript to add bidders dynamically -->
<script>
    function addBidder() {
        const div = document.createElement("div");
        div.className = "row mb-2";
        div.innerHTML = `
            <div class="col">
                <input type="text" name="name" class="form-control" placeholder="Bidder Name" required>
            </div>
            <div class="col">
                <input type="number" name="value" class="form-control" placeholder="Private Value" required>
            </div>
        `;
        document.getElementById("bidders").appendChild(div);
    }
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
